apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sa-indexer-ingress
  namespace: site-a
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: "nginx"
  rules:
    - host: indexer.sa.wazuh.itm.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sa-indexer
                port:
                  number: 9200
