apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Adds wazuh namespace to all resources.
namespace: site-d

secretGenerator:
  - name: indexer-certs #should automatically have certs of all indexers (all sites)
    files:
      - certs/indexer_cluster/root-ca.pem
      - certs/indexer_cluster/sa-indexer.pem
      - certs/indexer_cluster/sa-indexer-key.pem
      - certs/indexer_cluster/sb-indexer.pem
      - certs/indexer_cluster/sb-indexer-key.pem
      - certs/indexer_cluster/dashboard.pem
      - certs/indexer_cluster/dashboard-key.pem
      - certs/indexer_cluster/admin.pem
      - certs/indexer_cluster/admin-key.pem
      - certs/indexer_cluster/filebeat.pem
      - certs/indexer_cluster/filebeat-key.pem
  - name: dashboard-certs
    files:
      - certs/dashboard_http/cert.pem
      - certs/dashboard_http/key.pem
      - certs/indexer_cluster/root-ca.pem

configMapGenerator:
  - name: dashboard-conf
    files:
      - dashboard/dashboard_conf/opensearch_dashboards.yml
      - dashboard/dashboard_conf/config.yml

resources:
  - base/wazuh-ns.yaml
  - base/storage-class.yaml

  - dashboard/dashboard-svc.yaml
  - dashboard/dashboard-deploy.yaml

  - secrets/wazuh-api-cred-secret.yaml
  - secrets/wazuh-authd-pass-secret.yaml
  - secrets/wazuh-cluster-key-secret.yaml
  - secrets/dashboard-cred-secret.yaml
  - secrets/indexer-cred-secret.yaml

  - ingress/dashboard-ingress.yaml
